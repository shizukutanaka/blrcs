name: BLRCS (Go)

# ###########################################################################
# This workflow became active when blrcs was split out of the BLNCS monorepo
# into this standalone repository: it now lives at the repository-root
# .github/workflows/ directory, and the code it gates sits at the root too,
# so no working-directory or path prefixes are needed anymore.
#
# NOTE: the gate itself does not depend on this file. `make verify` runs the
# complete gate — build, gofmt, vet, zero-dependency proof, race tests, lint,
# and every fuzz target — in about 45 seconds. This workflow exists to run
# that same command on every push; it is not a second definition of what
# "passing" means.
# ###########################################################################
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blrcs-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. One target, identical to what a developer runs locally, so CI and
  # local cannot disagree about whether a change passes.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The version go.mod declares (the real support floor) and current
        # stable, so a regression on either is caught.
        go: ['1.22', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod

      - name: Install golangci-lint
        # make verify SKIPs lint when the tool is absent rather than failing, so
        # CI must install it explicitly — otherwise the gate would silently run
        # weaker here than on a developer machine.
        #
        # The committed .golangci.yml is schema v2, so the v2 line of the tool
        # is required: action v6 installs golangci-lint v1.x, whose
        # `config verify` rejects the v2 config ("additional properties
        # 'version'/'default'/'settings' not allowed") and the job died before
        # `make verify` ever ran. Action v7 is the first release line that
        # supports golangci-lint v2.
        #
        # The version is pinned (not `latest`) to the release the config is
        # verified against locally, so a tool release cannot silently change
        # what the gate enforces — bump it deliberately, with a local
        # `make verify` run, when upgrading.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: make verify
        run: make verify

  # Extras that produce artifacts rather than pass/fail signal, so they are not
  # part of `verify` and do not need the OS matrix.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: go.mod
      - run: make cover
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: go.mod
      - name: govulncheck (known CVEs, incl. the Go toolchain itself)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: go.mod
      - name: Generate SBOM (CycloneDX)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
